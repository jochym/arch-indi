name: Build INDI Libs for Arch Linux ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    # container:
    #   image: lopsided/archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
# 2. Uruchomienie budowania wewnątrz kontenera Arch Linux ARM64
      - name: Build Arch package inside container
        run: |
          docker run --rm \
            --privileged \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            lopsided/archlinux:latest /bin/bash -c "
            # Inicjalizacja pacmana i instalacja niezbędnych narzędzi
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Syu --noconfirm --needed base-devel git sudo

            # Budowanie pakietu jako użytkownik nie-root (wymóg makepkg)
            useradd -m builder
            echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
            chown -R builder:builder .
            
            # PKGDEST=/workspace wymusza zapisanie gotowego *.pkg.tar.zst w głównym katalogu
            sudo -u builder PKGDEST=/workspace makepkg -s --noconfirm
          "
