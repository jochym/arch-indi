name: Build INDI Libs for Arch Linux ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    container:
      image: lopsided/archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Checkout INDI sources
        uses: actions/checkout@v6
        with:
          repository: 'indilib/indi'
          ref: refs/tags/v2.2.2
          path: 'indi'

      - name: Initialize pacman and install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed base-devel git sudo

      - name: Build Arch package
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder .
          
          # -s automatycznie dociąga zależności z oficjalnych repozytoriów Archa
          sudo -u builder makepkg -s --noconfirm

      - name: Upload compiled package
        uses: actions/upload-artifact@v4
        with:
          name: libindi-arch-arm64
          path: "*.pkg.tar.zst"
          retention-days: 14
